openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: 우주풍선 낙하 예측 시뮬레이터 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: simulation
    description: Balloon trajectory simulation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /simulate:
    post:
      operationId: runSimulation
      tags: [simulation]
      summary: Run balloon trajectory simulation
      description: Fetches upper-air wind data and computes the full flight trajectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationInput"
      responses:
        "200":
          description: Simulation result with trajectory and landing prediction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"
        "400":
          description: Invalid input parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Failed to fetch wind data from Open-Meteo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /presets:
    get:
      operationId: getPresets
      tags: [simulation]
      summary: Get example balloon configuration presets
      description: Returns a list of predefined balloon launch configurations
      responses:
        "200":
          description: List of presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Preset"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SimulationInput:
      type: object
      required:
        - latitude
        - longitude
        - launch_datetime
        - ascent_rate
        - burst_altitude
        - descent_rate
      properties:
        latitude:
          type: number
          description: Launch latitude in decimal degrees
          minimum: -90
          maximum: 90
        longitude:
          type: number
          description: Launch longitude in decimal degrees
          minimum: -180
          maximum: 180
        launch_datetime:
          type: string
          description: ISO 8601 launch datetime (UTC)
        ascent_rate:
          type: number
          description: Balloon ascent rate in m/s
          minimum: 0.5
          maximum: 20
        burst_altitude:
          type: number
          description: Altitude at which the balloon bursts in meters
          minimum: 10000
          maximum: 45000
        descent_rate:
          type: number
          description: Parachute descent rate in m/s (positive = downward)
          minimum: 1
          maximum: 30
        time_step:
          type: number
          description: Simulation time step in seconds (default 60)
          minimum: 1
          maximum: 300

    TrajectoryPoint:
      type: object
      required:
        - time
        - latitude
        - longitude
        - altitude
        - phase
        - wind_speed
        - wind_direction
        - pressure_hpa
      properties:
        time:
          type: string
          description: ISO 8601 datetime at this point
        latitude:
          type: number
        longitude:
          type: number
        altitude:
          type: number
          description: Altitude in meters
        phase:
          type: string
          description: "ascent or descent"
        wind_speed:
          type: number
          description: Wind speed in m/s at this altitude
        wind_direction:
          type: number
          description: Wind direction in degrees (meteorological)
        pressure_hpa:
          type: number
          description: Atmospheric pressure in hPa at this altitude

    FlightStats:
      type: object
      required:
        - total_duration_seconds
        - ascent_duration_seconds
        - descent_duration_seconds
        - max_altitude
        - max_wind_speed
        - total_distance_km
        - horizontal_drift_km
      properties:
        total_duration_seconds:
          type: number
        ascent_duration_seconds:
          type: number
        descent_duration_seconds:
          type: number
        max_altitude:
          type: number
          description: Maximum altitude reached in meters
        max_wind_speed:
          type: number
          description: Peak wind speed encountered in m/s
        total_distance_km:
          type: number
          description: Total path length in km
        horizontal_drift_km:
          type: number
          description: Straight-line distance from launch to landing in km

    SimulationResult:
      type: object
      required:
        - trajectory
        - landing
        - stats
        - wind_data_fetched_at
      properties:
        trajectory:
          type: array
          items:
            $ref: "#/components/schemas/TrajectoryPoint"
        landing:
          $ref: "#/components/schemas/TrajectoryPoint"
        stats:
          $ref: "#/components/schemas/FlightStats"
        wind_data_fetched_at:
          type: string
          description: ISO 8601 datetime when wind data was fetched

    Preset:
      type: object
      required:
        - id
        - name
        - description
        - config
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        config:
          $ref: "#/components/schemas/SimulationInput"

    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
