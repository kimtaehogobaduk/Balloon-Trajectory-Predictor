openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: 우주풍선 낙하 예측 시뮬레이터 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: simulation
    description: Balloon trajectory simulation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /simulate:
    post:
      operationId: runSimulation
      tags: [simulation]
      summary: Run balloon trajectory simulation
      description: Fetches upper-air wind data and computes the full flight trajectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationInput"
      responses:
        "200":
          description: Simulation result with trajectory and landing prediction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"
        "400":
          description: Invalid input parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Failed to fetch wind data from Open-Meteo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /presets:
    get:
      operationId: getPresets
      tags: [simulation]
      summary: Get example balloon configuration presets
      description: Returns a list of predefined balloon launch configurations
      responses:
        "200":
          description: List of presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Preset"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SimulationInput:
      type: object
      required:
        - latitude
        - longitude
        - launch_datetime
        - balloon_mass_g
        - payload_mass_g
        - helium_volume_m3
        - parachute_diameter_m
        - parachute_cd
      properties:
        latitude:
          type: number
          description: Launch latitude in decimal degrees
          minimum: -90
          maximum: 90
        longitude:
          type: number
          description: Launch longitude in decimal degrees
          minimum: -180
          maximum: 180
        launch_datetime:
          type: string
          description: ISO 8601 launch datetime (UTC)
        balloon_mass_g:
          type: number
          description: Empty latex balloon mass in grams (determines burst diameter)
          minimum: 50
          maximum: 3000
        payload_mass_g:
          type: number
          description: Total payload mass in grams (instruments, camera, hardware)
          minimum: 0
          maximum: 10000
        helium_volume_m3:
          type: number
          description: >
            Volume of helium loaded at sea level (m³). Determines fill size,
            neck lift, and sea-level ascent rate via force balance.
          minimum: 0.1
          maximum: 500
        parachute_diameter_m:
          type: number
          description: Parachute canopy diameter in metres
          minimum: 0.2
          maximum: 10
        parachute_cd:
          type: number
          description: >
            Parachute drag coefficient. Typical values:
            hemispheric 0.75, octagonal 0.85, cross/cruciform 0.97
          minimum: 0.3
          maximum: 1.5
        time_step:
          type: number
          description: Simulation time step in seconds (default 60)
          minimum: 1
          maximum: 300

    BalloonConfig:
      type: object
      required:
        - fill_diameter_m
        - burst_diameter_m
        - burst_altitude_m
        - neck_lift_n
        - volume_fill_m3
        - ascent_rate_ms
        - descent_rate_sl_ms
      properties:
        fill_diameter_m:
          type: number
          description: Balloon diameter at sea level fill (m)
        burst_diameter_m:
          type: number
          description: Balloon diameter at burst (m)
        burst_altitude_m:
          type: number
          description: Calculated theoretical burst altitude (m)
        neck_lift_n:
          type: number
          description: Net upward force at sea level in Newtons
        volume_fill_m3:
          type: number
          description: Fill volume at sea level in cubic metres (equals helium_volume_m3)
        ascent_rate_ms:
          type: number
          description: Calculated sea-level terminal ascent rate (m/s)
        descent_rate_sl_ms:
          type: number
          description: Calculated sea-level parachute descent rate (m/s)

    TrajectoryPoint:
      type: object
      required:
        - time
        - latitude
        - longitude
        - altitude
        - phase
        - wind_speed
        - wind_direction
        - pressure_hpa
        - horizontal_speed
        - vertical_speed
        - total_speed
        - bearing
      properties:
        time:
          type: string
          description: ISO 8601 datetime at this point
        latitude:
          type: number
        longitude:
          type: number
        altitude:
          type: number
          description: Altitude in meters
        phase:
          type: string
          description: "ascent or descent"
        wind_speed:
          type: number
          description: Interpolated wind speed in m/s at this altitude
        wind_direction:
          type: number
          description: Interpolated wind direction in degrees (meteorological)
        pressure_hpa:
          type: number
          description: Atmospheric pressure in hPa at this altitude
        horizontal_speed:
          type: number
          description: Horizontal ground speed in m/s
        vertical_speed:
          type: number
          description: Vertical speed in m/s (positive = ascending, negative = descending)
        total_speed:
          type: number
          description: Total 3D speed magnitude in m/s
        bearing:
          type: number
          description: Direction of travel in degrees (0=north, 90=east)

    FlightStats:
      type: object
      required:
        - total_duration_seconds
        - ascent_duration_seconds
        - descent_duration_seconds
        - max_altitude
        - max_wind_speed
        - max_horizontal_speed
        - max_total_speed
        - total_distance_km
        - horizontal_drift_km
      properties:
        total_duration_seconds:
          type: number
        ascent_duration_seconds:
          type: number
        descent_duration_seconds:
          type: number
        max_altitude:
          type: number
          description: Maximum altitude reached in meters
        max_wind_speed:
          type: number
          description: Peak wind speed encountered in m/s
        max_horizontal_speed:
          type: number
          description: Peak horizontal ground speed in m/s
        max_total_speed:
          type: number
          description: Peak 3D speed magnitude in m/s
        total_distance_km:
          type: number
          description: Total path length in km
        horizontal_drift_km:
          type: number
          description: Straight-line distance from launch to landing in km

    SimulationResult:
      type: object
      required:
        - trajectory
        - landing
        - stats
        - balloon_config
        - wind_data_fetched_at
      properties:
        trajectory:
          type: array
          items:
            $ref: "#/components/schemas/TrajectoryPoint"
        landing:
          $ref: "#/components/schemas/TrajectoryPoint"
        stats:
          $ref: "#/components/schemas/FlightStats"
        balloon_config:
          $ref: "#/components/schemas/BalloonConfig"
        wind_data_fetched_at:
          type: string
          description: ISO 8601 datetime when wind data was fetched

    Preset:
      type: object
      required:
        - id
        - name
        - description
        - config
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        config:
          $ref: "#/components/schemas/SimulationInput"

    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
